name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Refresh the android/ folder with the newest Flutter template so the build
      # never breaks because of Gradle/AGP version changes. App icon + name are kept.
      - name: Refresh Android files
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r android/app/src/main/res /tmp/res.bak
          rm -rf android
          flutter create . --platforms=android --project-name nexus_calc --org com.nexuscalc
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp -r /tmp/res.bak/mipmap-* android/app/src/main/res/
          sed -i 's/android:label="[^"]*"/android:label="Nexus Calc 4D"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-calc-apk
          path: build/app/outputs/flutter-apk/app-release.apk
